name: Build and test native macOS
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      python_arch:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ inputs.python_arch }}
      - name: Install pinned native dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-macos.txt
          python -m compileall -q src
          python -c "import av,platform,psutil; assert av.__version__=='18.1.1'; print(platform.machine(),psutil.virtual_memory().total, av.__version__)"
      - name: Build and test frozen application
        run: python -u scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MarVoiReflex-macOS-${{ inputs.arch }}
          path: |
            dist-macos/MarVoiReflex-macOS-${{ inputs.arch }}.zip
            dist-macos/SHA256SUMS-${{ inputs.arch }}.txt
            dist-macos/validation-${{ inputs.arch }}.json
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macOS-diagnostics-${{ inputs.arch }}
          path: |
            dist-macos/validation-*.log
            dist-macos/validation-*.json
            dist-macos/validation-*.jsonl
            dist-macos/validation-*.txt
          if-no-files-found: ignore
