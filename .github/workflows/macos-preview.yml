name: macOS native preview
on:
  push:
    branches: [feature/macos-preview]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements-macos.txt'
      - '.github/workflows/*macos*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_arm64:
    uses: ./.github/workflows/build-macos-native.yml
    with:
      runner: macos-15
      arch: arm64
      python_arch: arm64
  build_intel:
    uses: ./.github/workflows/build-macos-native.yml
    with:
      runner: macos-15-intel
      arch: x86_64
      python_arch: x64
  publish_arm64:
    needs: build_arm64
    if: success() && github.ref == 'refs/heads/feature/macos-preview'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-macos-native.yml
    with:
      arch: arm64
      label: Apple Silicon
  publish_intel:
    needs: build_intel
    if: success() && github.ref == 'refs/heads/feature/macos-preview'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-macos-native.yml
    with:
      arch: x86_64
      label: Intel
